name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle
      - name: Lint, test and build
        run: ./gradlew ktlintCheck :shared:testAndroidHostTest :androidApp:lintDebug :androidApp:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: apk-debug
          path: androidApp/build/outputs/apk/debug/*.apk
